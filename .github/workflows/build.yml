name: build

# Builds the installer for Windows and macOS. A pushed tag (v1.2.3) also
# publishes a GitHub release with both files; a tag with a dash (v1.0.0-beta.1)
# becomes a pre-release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: End-to-end test against fake launcher folders
        shell: bash
        run: |
          FAKE="$RUNNER_TEMP/fakehome"
          mkdir -p "$FAKE/AppData/Roaming"
          if [ "$RUNNER_OS" = "Windows" ]; then
            APPDATA="$(cygpath -w "$FAKE/AppData/Roaming")" npm test
          else
            HOME="$FAKE" npm test
          fi

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
            files: dist/*.exe
          - os: macos-latest
            cmd: dist:mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la out
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "CobbleAsia Installer $TAG" --notes-file - $pre <<'EOF'
          **Windows:** download the `.exe` and run it. If Windows says "Windows protected your PC", press **More info → Run anyway** (the app isn't code-signed yet).
          **Mac:** download the `.dmg`, open it and drag the app to Applications. The first time, right-click the app → **Open**. On newer macOS, if it's blocked, go to **System Settings → Privacy & Security → Open Anyway**.

          The installer finds the Minecraft launchers on your computer and installs the Cobble Asia client pack into them. Run it again any time to update the mods.
          EOF
